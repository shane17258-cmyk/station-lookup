<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>4G / 5G 台號站台查詢</title>
<meta name="description" content="依台號查詢台名、站台與細胞詳細資料">
<meta name="theme-color" content="#2f6fad">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f0f4f8;
    --primary: #2f6fad;
    --primary-dark: #1a3a5c;
    --card-bg: #fff;
    --max-w: 680px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(12px, 3vw, 32px) 16px;
    padding-top: calc(clamp(12px, 3vw, 32px) + env(safe-area-inset-top));
  }
  h1 { color: var(--primary-dark); margin-bottom: 8px; font-size: clamp(20px, 4.5vw, 28px); text-align: center; }
  .subtitle { color: #5a7a9a; margin-bottom: clamp(12px, 3vw, 24px); font-size: 14px; text-align: center; }

  .tabs {
    display: flex;
    background: var(--card-bg);
    border-radius: 12px 12px 0 0;
    box-shadow: 0 4px 16px rgba(26,58,92,.12);
    width: 100%;
    max-width: var(--max-w);
    overflow: hidden;
  }
  .tab {
    flex: 1;
    padding: 14px 16px;
    text-align: center;
    font-size: clamp(15px, 4vw, 17px);
    font-weight: 700;
    color: #6b8aa8;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color .2s, border-color .2s, background .2s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tab:hover { color: var(--primary); }
  .tab.active { color: var(--primary-dark); border-bottom-color: var(--primary); background: #f7fafc; }

  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--card-bg);
    border-radius: 0 0 12px 12px;
    box-shadow: 0 4px 16px rgba(26,58,92,.12);
    width: 100%;
    max-width: var(--max-w);
    padding: clamp(16px, 3.5vw, 28px);
  }
  label { display: block; font-weight: 700; color: var(--primary-dark); margin-bottom: 8px; font-size: 15px; }
  input {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border: 2px solid #c8d6e4;
    border-radius: 8px;
    background: #fafcfe;
    color: var(--primary-dark);
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--primary); }
  .hint { font-size: 12px; color: #8aa4bd; margin-top: 6px; }
  .result {
    margin-top: 24px;
    border-top: 1px solid #e2eaf2;
    padding-top: 20px;
    display: none;
  }
  .result.show { display: block; }
  .field { margin-bottom: 18px; }
  .field .key { font-size: 13px; color: #6b8aa8; font-weight: 600; margin-bottom: 6px; }
  .field .value { font-size: clamp(16px, 3.5vw, 18px); color: var(--primary-dark); font-weight: 700; }
  .field .value small { font-weight: 400; color: #7893ad; }
  .note { font-size: 12px; color: #8aa4bd; margin-top: 10px; }
  .meta { font-size: 13px; color: #5a7a9a; line-height: 1.8; }
  .placeholder { text-align: center; color: #9ab0c4; padding: 12px 0; }
  .center-hint { text-align: center; color: #9ab0c4; padding: 10px 0; }

  .search-results {
    background: var(--card-bg);
    border: 2px solid #c8d6e4;
    border-radius: 8px;
    margin-top: 6px;
    max-height: min(260px, 45vh);
    overflow-y: auto;
    display: none;
    -webkit-overflow-scrolling: touch;
  }
  .search-results.show { display: block; }
  .search-item {
    padding: 12px 14px;
    cursor: pointer;
    border-bottom: 1px solid #eef3f8;
    transition: background .15s;
  }
  .search-item:last-child { border-bottom: none; }
  .search-item:hover, .search-item:active { background: #e8f1fa; }
  .search-item .s-name { font-size: 14px; color: var(--primary-dark); font-weight: 700; }
  .search-item .s-meta { font-size: 12px; color: #6b8aa8; margin-top: 2px; }
  .search-item .s-arrow { float: right; color: var(--primary); font-weight: 700; }
  .search-count { font-size: 12px; color: #8aa4bd; margin-top: 6px; }

  .search-row { display: flex; gap: 8px; }
  .search-row .search-town {
    flex: 0 0 auto;
    width: 110px;
    padding: 10px 8px;
    font-size: 14px;
    border: 2px solid #c8d6e4;
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text);
  }
  .search-row .search-town:focus { outline: none; border-color: var(--primary); }
  .search-row input { flex: 1; min-width: 0; }

  .station-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    background: #e8f1fa;
    border: 1px solid #c6d9ec;
    border-radius: 8px;
    padding: 8px 12px;
    gap: 6px;
    font-size: clamp(13px, 3.2vw, 15px);
    color: var(--primary-dark);
  }
  .station-bar .num {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    border-radius: 50%;
    width: 20px; height: 20px;
    line-height: 20px;
    text-align: center;
    font-size: 12px;
    margin-right: 4px;
    flex-shrink: 0;
  }
  .station-bar .s-name-inline { font-weight: 700; word-break: break-all; }
  .station-bar .lid {
    display: inline-block;
    background: #eef7ee;
    color: #2e7d32;
    border: 1px solid #b8dcc0;
    border-radius: 12px;
    padding: 1px 10px;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .station-bar .sec {
    background: #fff;
    color: var(--primary);
    border: 1px solid #b6d0e8;
    border-radius: 12px;
    padding: 1px 8px;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .station-bar .meter {
    display: inline-block;
    background: #fff8e6;
    color: #b7791f;
    border: 1px solid #ecd7a0;
    border-radius: 12px;
    padding: 1px 10px;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .station-bar .meter.outage {
    background: #fdecea;
    color: #b0301c;
    border-color: #efc1b8;
  }
  .station-bar .meter.normal {
    background: #eaf7ee;
    color: #2e7d32;
    border-color: #b8dcc0;
  }
  .station-bar .addr {
    display: inline-block;
    background: #eef4fb;
    color: #3a5c7e;
    border: 1px solid #c9dcef;
    border-radius: 12px;
    padding: 1px 10px;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .station-bar .eac-smod {
    display: inline-block;
    background: #fdecea;
    color: #b0301c;
    border: 1px solid #efc1b8;
    border-radius: 12px;
    padding: 1px 10px;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .station-bar .coord2 { font-size: 11px; color: #6b8aa8; margin-left: 4px; }
  .station-bar .toggle {
    cursor: pointer;
    color: var(--primary);
    font-weight: 700;
    font-size: 13px;
    margin-left: auto;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .station-bar .toggle:hover { text-decoration: underline; }
  .station-bar .mapbtn {
    display: inline-block;
    background: #fff;
    color: #c0392b;
    border: 1px solid #e8c4bc;
    border-radius: 12px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
  }
  .station-bar .mapbtn:hover { background: #fdf0ee; }

  .photo-area {
    margin-top: 6px;
    margin-left: 30px;
    background: #fbfcfd;
    border: 1px solid #e2ecf4;
    border-radius: 12px;
    padding: 10px;
  }
  .photo-area .photo-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 8px;
  }
  .photo-area .photo-title.photo-toggle {
    cursor: pointer;
    color: var(--primary);
    margin-bottom: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .photo-area .photo-title.photo-toggle:hover { text-decoration: underline; }
  .photo-area .photo-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .photo-area .photo-content .photo-grid { margin-top: 8px; }
  .photo-area .photo-grid img {
    width: 76px;
    height: 76px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #d5e2ee;
    background: #eef4f9;
  }
  .photo-area .photo-grid a.photo-more {
    width: 76px;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px dashed #b9cfe3;
    border-radius: 8px;
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
  }
  .photo-area .photo-empty {
    font-size: 12px;
    color: #8ba0b4;
  }
  .photo-area .photo-actions { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .photo-area .upload-btn {
    display: inline-block;
    background: #eaf3fb;
    color: var(--primary);
    border: 1px solid #bfd8ec;
    border-radius: 12px;
    padding: 3px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
  }
  .photo-area .upload-btn:hover { background: #dcebf8; }
  .photo-area .photo-hint { font-size: 11px; color: #8ba0b4; }
  .photo-area .photo-status { font-size: 12px; color: #2e7d32; font-weight: 700; }
  .photo-area .photo-status.err { color: #c0392b; }

  /* Lightbox for swipe navigation */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: 95vw;
    max-height: 88vh;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
    user-select: none;
    -webkit-user-drag: none;
  }
  .lightbox .lb-caption {
    color: #fff;
    font-size: 13px;
    margin-top: 10px;
    opacity: .85;
  }
  .lightbox .lb-close {
    position: absolute;
    top: 14px;
    right: 16px;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    line-height: 1;
    user-select: none;
  }
  .lightbox .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    font-size: 36px;
    cursor: pointer;
    padding: 12px 16px;
    user-select: none;
    opacity: .85;
  }
  .lightbox .lb-nav:hover { opacity: 1; }
  .lightbox .lb-prev { left: 6px; }
  .lightbox .lb-next { right: 6px; }
  @media (max-width: 600px) {
    .lightbox .lb-nav { font-size: 28px; padding: 10px 12px; }
  }

  .detail {
    display: none;
    margin-top: 6px;
    padding: 14px;
    background: #f7fafc;
    border: 1px solid #dbe6f0;
    border-radius: 10px;
  }
  .detail.show { display: block; }
  .detail-title { font-size: 14px; font-weight: 700; color: var(--primary-dark); margin-bottom: 10px; }
  .cell-sec { margin-bottom: 12px; }
  .cell-sec:last-child { margin-bottom: 0; }
  .cell-sec-title { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
  .cell-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .cell-card {
    background: #fff;
    border: 1px solid #d4e2f0;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--primary-dark);
    min-width: 120px;
    flex: 1 1 auto;
  }
  .cell-card .c-id { font-weight: 700; font-size: 14px; color: var(--primary-dark); }
  .cell-card .c-rmod {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    border-radius: 4px;
    padding: 1px 8px;
    font-size: 12px;
    font-weight: 700;
    margin-top: 4px;
  }
  .cell-card .c-cov {
    display: inline-block;
    border-radius: 4px;
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 700;
    margin-left: 4px;
  }
  .cell-card .c-cov.outdoor { background: #e3f2e3; color: #2e7d32; border: 1px solid #b7dfb9; }
  .cell-card .c-cov.indoor { background: #fff3e0; color: #e65100; border: 1px solid #f3c894; }
  .cell-card .c-meta { font-size: 11px; color: #6b8aa8; margin-top: 4px; line-height: 1.5; }
  .cell-card .c-map a { color: #c0392b; text-decoration: none; font-size: 11px; font-weight: 600; }
  .cell-card .c-map a:hover { text-decoration: underline; }
  .cell-card .c-eac {
    display: inline-block;
    background: #fdecea;
    color: #b0301c;
    border: 1px solid #efc1b8;
    border-radius: 4px;
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 700;
    margin-top: 4px;
  }

  @media (min-width: 760px) {
    :root { --max-w: 720px; }
    .card, .tabs { max-width: 720px; }
    .cell-card { min-width: 200px; }
  }

  @media (max-width: 480px) {
    .station-bar .mapbtn { width: 100%; text-align: center; }
    .station-bar .toggle { margin-left: 0; }
    .station-bar { gap: 4px; }
  }

  /* ============ 涵蓋地圖 ============ */
  .map-card {
    background: var(--card-bg);
    border-radius: 0 0 12px 12px;
    box-shadow: 0 4px 16px rgba(26,58,92,.12);
    width: 100%;
    max-width: var(--max-w);
    padding: clamp(16px, 3.5vw, 28px);
  }
  #coverageMap {
    width: 100%;
    height: 62vh;
    min-height: 380px;
    border-radius: 10px;
    border: 1px solid #d5e2ee;
    z-index: 1;
  }
  .map-tools {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    margin-bottom: 14px;
    font-size: 14px;
    color: var(--primary-dark);
  }
  .map-tools .mt-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .map-tools label.mt-label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin: 0;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    color: var(--primary-dark);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .map-tools input[type=checkbox] {
    width: auto;
    padding: 0;
    accent-color: var(--primary);
    cursor: pointer;
  }
  .map-tools select {
    padding: 6px 10px;
    font-size: 14px;
    border: 2px solid #c8d6e4;
    border-radius: 8px;
    background: #fafcfe;
    color: var(--primary-dark);
    outline: none;
    cursor: pointer;
  }
  .map-legend {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    font-size: 12px;
    color: #5a7a9a;
    line-height: 1.6;
  }
  .map-legend .lg-item { display: inline-flex; align-items: center; gap: 5px; }
  .map-legend .lg-swatch {
    display: inline-block;
    width: 16px;
    height: 10px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,.15);
  }
  .map-legend .lg-swatch.point {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .cov-bts-label {
    background: #fff;
    border: 1px solid #2f6fad;
    color: #2f6fad;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 3px;
    white-space: nowrap;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  .cov-pci-label {
    background: #fff;
    border: 1px solid #888;
    color: #111;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 3px;
    white-space: nowrap;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  .locate-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: var(--primary);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background .2s;
  }
  .locate-btn:hover { background: var(--primary-dark); }
  .locate-btn:disabled { background: #9ab0c4; cursor: wait; }
  .locate-status {
    font-size: 12px;
    color: #8aa4bd;
    min-height: 16px;
    margin-bottom: 6px;
    line-height: 1.5;
  }
  .locate-status.err { color: #c0392b; }
  .locate-status.ok { color: #2e7d32; }
  .map-loading {
    text-align: center;
    color: #8aa4bd;
    padding: 18px 0;
    font-size: 13px;
    display: none;
  }
</style>
</head>
<body>
  <h1>4G / 5G 台號站台查詢</h1>
  <div class="subtitle">苗栗基維股 · 依台號查詢台名、站台與細胞詳細資料</div>

  <div class="tabs">
    <div class="tab active" data-net="4g" id="tab4g">4G</div>
    <div class="tab" data-net="5g" id="tab5g">5G</div>
    <div class="tab" data-net="map" id="tabmap">涵蓋地圖</div>
  </div>

  <div class="panel active" id="panel-4g">
    <div class="card">
      <label for="idInput4g">4G 台號 (lnBtsId)</label>
      <input id="idInput4g" list="idList4g" placeholder="輸入或選擇 4G 台號" autocomplete="off">
      <datalist id="idList4g"></datalist>
      <div class="hint">可直接輸入 lnBtsId，或從下拉清單中選擇</div>

      <div id="result4g" class="result">
        <div class="field">
          <div class="key">站名 (SiteName)</div>
          <div class="value" id="outName4g"></div>
        </div>
        <div class="field">
          <div class="key">台名 (lnBtsIdLL_NameChs)</div>
          <div id="outStations4g"></div>
        </div>
        <div class="field meta" id="outMeta4g"></div>
      </div>
    </div>

    <div class="card" style="margin-top: 16px;">
      <label>站台名稱搜尋 (lnBtsIdLL_NameChs)</label>
      <div class="search-row">
        <select id="searchTown4g" class="search-town"></select>
        <input id="searchInput4g" placeholder="輸入站台名稱關鍵字" autocomplete="off">
      </div>
      <div class="search-count" id="searchCount4g"></div>
      <div class="search-results" id="searchResults4g"></div>
      <div class="hint">先選擇鄉鎮（或全部），再輸入站台名稱關鍵字，點擊結果即顯示該站台詳情</div>
    </div>
  </div>

  <div class="panel" id="panel-5g">
    <div class="card">
      <label for="idInput5g">5G 台號 (nrBtsId)</label>
      <input id="idInput5g" list="idList5g" placeholder="輸入或選擇 5G 台號" autocomplete="off">
      <datalist id="idList5g"></datalist>
      <div class="hint">可直接輸入 nrBtsId，或從下拉清單中選擇</div>

      <div id="result5g" class="result">
        <div class="field">
          <div class="key">站名 (SiteName)</div>
          <div class="value" id="outName5g"></div>
        </div>
        <div class="field">
          <div class="key">台名 (nrBtsIdNN_NameChs)</div>
          <div id="outStations5g"></div>
        </div>
        <div class="field meta" id="outMeta5g"></div>
      </div>
    </div>

    <div class="card" style="margin-top: 16px;">
      <label>站台名稱搜尋 (nrBtsIdNN_NameChs)</label>
      <div class="search-row">
        <select id="searchTown5g" class="search-town"></select>
        <input id="searchInput5g" placeholder="輸入站台名稱關鍵字" autocomplete="off">
      </div>
      <div class="search-count" id="searchCount5g"></div>
      <div class="search-results" id="searchResults5g"></div>
      <div class="hint">先選擇鄉鎮（或全部），再輸入站台名稱關鍵字，點擊結果即顯示該站台詳情</div>
    </div>
  </div>

  <div class="panel" id="panel-map">
    <div class="map-card">
      <div class="map-tools">
        <div class="mt-group">
          <label class="mt-label" for="selTown" style="font-weight:700; font-size:14px;">鄉鎮：</label>
          <select id="selTown">
            <option value="all">全部鄉鎮</option>
          </select>
        </div>
        <div class="mt-group">
          <span style="font-weight:700; font-size:14px;">顯示：</span>
          <label class="mt-label"><input type="checkbox" id="chk4g" checked> 4G 扇形</label>
          <select id="sel4gMode">
            <option value="orig">原始半徑</option>
            <option value="ue">UE 距離</option>
          </select>
          <select id="sel4gBand">
            <option value="all">全部頻段</option>
            <option value="L900">L900</option>
            <option value="L1800">L1800</option>
            <option value="L2600">L2600</option>
            <option value="L2100">L2100</option>
          </select>
        </div>
        <div class="mt-group">
          <label class="mt-label"><input type="checkbox" id="chk5g" checked> 5G 扇形</label>
          <select id="sel5gBand">
            <option value="all">全部頻段</option>
            <option value="N2100">N2100</option>
            <option value="N3500">N3500</option>
          </select>
        </div>
        <div class="mt-group">
          <label class="mt-label"><input type="checkbox" id="chkPoints" checked> 站台點位</label>
          <select id="selPointNet">
            <option value="both">4G + 5G</option>
            <option value="4g">僅 4G</option>
            <option value="5g">僅 5G</option>
          </select>
        </div>
        <div class="mt-group" style="margin-left:auto;">
          <button type="button" id="btnLocate" class="locate-btn" title="回到我的位置">📌 我的位置</button>
        </div>
      </div>
      <div id="locateStatus" class="locate-status"></div>
      <div id="mapLoading" class="map-loading">資料載入中…</div>
      <div id="coverageMap"></div>
      <div class="map-legend">
        <span class="lg-item"><span class="lg-swatch" style="background:#2f6fad;opacity:.45;"></span>4G 扇形</span>
        <span class="lg-item"><span class="lg-swatch" style="background:#2e7d32;opacity:.4;"></span>5G 扇形</span>
        <span class="lg-item"><span class="lg-swatch point" style="background:#1a3a5c;"></span>4G 站台</span>
        <span class="lg-item"><span class="lg-swatch point" style="background:#e65100;"></span>5G 站台</span>
        <span class="lg-item" style="color:#8aa4bd;">點扇形或點位可查看詳情</span>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="data5g.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ============ 站台照片（Cloudflare Worker） ============
    // 照片透過 Cloudflare Worker 存取 Google Drive，電腦關機也能看。
    const PHOTO_SERVER = window.PHOTO_SERVER || 'https://station-photo.shane17258.workers.dev';

    // ============ 停電資訊（台電每日 07:00 更新，僅 4G） ============
    let outageData = {};
    fetch('outage.json', {cache: 'no-store'}).then(r=>r.json()).then(j=>{outageData=j;}).catch(()=>{});
    function outageBadge(meter){
      const norm = meter.replace(/[^0-9]/g,"");
      const info = outageData[norm] || outageData[meter];
      if(!info || !info.found) return '<span class="meter normal">電號 '+meter+' 正常供電中</span>';
      const now = new Date();
      const s = new Date(info.start);
      const e = new Date(info.end);
      const endStr = info.end.slice(11,16);
      const reason = info.reason ? ' '+info.reason : '';
      if(now >= s && now <= e) return '<span class="meter outage">電號 '+meter+' 停電中（預計至 '+endStr+reason+'）</span>';
      if(now < s) return '<span class="meter">電號 '+meter+' 預定停電 '+info.start.slice(0,16).replace("T"," ")+' 至 '+endStr+'</span>';
      return '<span class="meter normal">電號 '+meter+' 正常供電中</span>';
    }

    function photoApi(station, path) {
      return PHOTO_SERVER + path + '?station=' + encodeURIComponent(station);
    }

    const photoCache = new Map();
    async function loadPhotos(station, gridEl, statusEl) {
      try {
        if (photoCache.has(station)) {
          renderPhotos(station, photoCache.get(station), gridEl);
          if (statusEl) { statusEl.textContent = ''; statusEl.className = 'photo-status'; }
          return;
        }
        if (statusEl) { statusEl.textContent = '載入中…'; statusEl.className = 'photo-status'; }
        gridEl.innerHTML = '<div class="photo-empty">載入中…</div>';
        const res = await fetch(photoApi(station, '/api/photos'));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const photos = data.photos || [];
        photoCache.set(station, photos);
        renderPhotos(station, photos, gridEl);
        if (statusEl) { statusEl.textContent = ''; statusEl.className = 'photo-status'; }
      } catch (e) {
        gridEl.innerHTML = '';
        if (statusEl) {
          statusEl.textContent = '⚠ 無法連線照片伺服器（請確認網路可連至 Cloudflare Worker）';
          statusEl.className = 'photo-status err';
        }
      }
    }

    function renderPhotos(station, photos, gridEl) {
      if (!photos.length) {
        gridEl.innerHTML = '<div class="photo-empty">尚無照片</div>';
        return;
      }
      const shown = photos.slice(0, 12);
      const rest = photos.length - shown.length;
      gridEl.innerHTML = '';
      shown.forEach((p, idx) => {
        const a = document.createElement('a');
        a.href = PHOTO_SERVER + p.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.addEventListener('click', (e)=>{ e.preventDefault(); openLightbox(photos, photos.indexOf(p)); });
        const img = document.createElement('img');
        img.src = p.thumb || (PHOTO_SERVER + p.url);
        img.alt = p.name;
        img.loading = 'lazy';
        a.appendChild(img);
        gridEl.appendChild(a);
      });
      if (rest > 0) {
        const a = document.createElement('a');
        a.className = 'photo-more';
        a.href = PHOTO_SERVER + '/api/photos?station=' + encodeURIComponent(station);
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = '+' + rest;
        gridEl.appendChild(a);
      }
    }

    function attachPhotoUpload(station, inputEl, gridEl, statusEl) {
      inputEl.addEventListener('change', async () => {
        const files = Array.from(inputEl.files || []);
        if (!files.length) return;
        statusEl.textContent = '上傳中…';
        statusEl.className = 'photo-status';
        const fd = new FormData();
        files.forEach(f => fd.append('files', f));
        try {
          const res = await fetch(photoApi(station, '/api/upload'), { method: 'POST', body: fd });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || '上傳失敗');
          statusEl.textContent = '已上傳 ' + data.saved.length + ' 張';
          statusEl.className = 'photo-status';
          inputEl.value = '';
          loadPhotos(station, gridEl, statusEl);
        } catch (e) {
          statusEl.textContent = '⚠ 上傳失敗：' + e.message;
          statusEl.className = 'photo-status err';
        }
      });
    }

    function createPhotoArea(station) {
      const el = document.createElement('div');
      el.className = 'photo-area';
      const head = document.createElement('div');
      head.className = 'photo-title photo-toggle';
      head.textContent = '檢視照片 ▸';
      el.appendChild(head);
      const opened = () => {
        head.textContent = '收合照片 ▾';
        const content = document.createElement('div');
        content.className = 'photo-content';
        content.innerHTML =
          '<div class="photo-grid"></div>' +
          '<div class="photo-actions">' +
          '<label class="upload-btn">📷 上傳照片<input type="file" accept="image/*" multiple hidden></label>' +
          '<span class="photo-hint">照片將存入 Google Drive「' + escapeHtml(station) + '/」資料夾</span>' +
          '<span class="photo-status"></span>' +
          '</div>';
        el.insertBefore(content, head.nextSibling);
        const gridEl = content.querySelector('.photo-grid');
        const statusEl = content.querySelector('.photo-status');
        const inputEl = content.querySelector('input[type=file]');
        const btnEl = content.querySelector('.upload-btn');
        if (btnEl) {
          btnEl.addEventListener('click', (ev) => {
            if (ev.target !== inputEl) { ev.preventDefault(); inputEl.click(); }
          });
        }
        attachPhotoUpload(station, inputEl, gridEl, statusEl);
        loadPhotos(station, gridEl, statusEl);
      };
      head.addEventListener('click', () => {
        const c = el.querySelector('.photo-content');
        if (c) {
          c.remove();
          head.textContent = '檢視照片 ▸';
        } else {
          opened();
        }
      });
      return el;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function createNetController(cfg) {
      const {
        data, idInput, idList, result, outName, outStations, outMeta,
        searchTown, searchInput, searchResults, searchCount, idLabel
      } = cfg;

      const stationIndex = [];
      data.forEach(item => {
        item.stations.forEach((s, i) => {
          stationIndex.push({
            name: s,
            id: item.id,
            siteNameCV: item.siteNameCV,
            town: (item.towns && item.towns[i]) || item.town || '',
            sec: (item.sec && item.sec.split('_')[i]) || '',
            coord: (item.coords && item.coords[i]) || null
          });
        });
      });

      const allOpt = document.createElement('option');
      allOpt.value = '';
      allOpt.textContent = '全部鄉鎮';
      searchTown.appendChild(allOpt);
      const towns = [];
      stationIndex.forEach(s => {
        if (s.town && towns.indexOf(s.town) === -1) towns.push(s.town);
      });
      towns.sort((a, b) => a.localeCompare(b, 'zh-Hant-TW'));
      towns.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        searchTown.appendChild(opt);
      });

      data.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.id + ' - ' + (item.siteNameCV || '');
        idList.appendChild(opt);
      });

      function buildCellDetail(item, station, coord) {
        const groups = item.cells[station] || [];
        let html = '<div class="detail-title">細胞詳細資料</div>';
        if (!groups.length) {
          html += '<div class="placeholder">無細胞資料</div>';
          return html;
        }
        const eacInfo = (item.eac && item.eac[station]) || null;
        const rmodCells = (eacInfo && eacInfo.rmod) ? eacInfo.rmod : {};
        groups.forEach(g => {
          html += '<div class="cell-sec">';
          html += '<div class="cell-sec-title">扇區 S' + g.sec + '</div>';
          html += '<div class="cell-row">';
          g.cells.forEach(c => {
            const cov = (c.cov || '');
            const covClass = cov.indexOf('Indoor') !== -1 ? 'indoor' : 'outdoor';
            const hasCellCoord = c.lat && c.lon;
            const mapHref = hasCellCoord
              ? 'https://www.google.com/maps?q=' + c.lat + ',' + c.lon
              : (coord ? 'https://www.google.com/maps?q=' + coord.lat + ',' + coord.lon : '');
            const rAlarms = rmodCells[String(c.cel)];
            const isEac = !!rAlarms;
            html += '<div class="cell-card"' + (isEac ? ' style="border-color:#efc1b8;background:#fff7f6;"' : '') + '>' +
              '<div class="c-id">' + idLabel + ' ' + c.cel + '</div>' +
              (isEac ? '<div class="c-eac">外部告警：' + rAlarms.join('、') + '</div>' : '') +
              '<div class="c-rmod">' + (c.rmod || '-') + '</div>' +
              '<div class="c-cov ' + covClass + '">' + cov + '</div>' +
              '<div class="c-meta">' +
              '方位角：' + (c.az || '-') + '°　上傾角：' + (c.mt || '-') + '°　下傾角：' + (c.et || '-') + '°' +
              (c.toff ? '<br>傾斜補償：' + c.toff + '°' : '') +
              (hasCellCoord ? '<br>座標：' + c.lat + ', ' + c.lon : '') +
              '</div>';
            if (mapHref) {
              html += '<div class="c-map"><a target="_blank" rel="noopener" href="' + mapHref + '">Google 地圖</a></div>';
            }
            html += '</div>';
          });
          html += '</div></div>';
        });
        return html;
      }

      function render(item) {
        outName.textContent = item.siteName || '-';
        outName.innerHTML = (item.siteName || '-') +
          (item.siteNameCV && item.siteName && item.siteNameCV !== item.siteName
            ? ' <small>(' + item.siteNameCV + ')</small>' : '');

        outStations.innerHTML = '';
        const secs = item.sec ? item.sec.split('_') : [];
        if (item.stations && item.stations.length) {
          item.stations.forEach((s, i) => {
            const coord = (item.coords && item.coords[i]) ? item.coords[i] : null;
            const cells = (item.cells && item.cells[s]) ? item.cells[s] : [];
            const meters = (item.meters && item.meters[s]) ? item.meters[s] : [];
            const stationTown = (item.towns && item.towns[i]) ? item.towns[i] : (item.town || '');

            const wrap = document.createElement('div');
            wrap.style.marginBottom = '6px';

            const addr = (item.addr && item.addr[s]) || '';
            const smodAlarms = (item.smod && item.smod[s]) ? item.smod[s] : [];
            const lids = (item.lid && item.lid[s]) ? item.lid[s] : [];

            const bar = document.createElement('div');
            bar.className = 'station-bar';
            bar.innerHTML =
              '<span class="num">' + (i + 1) + '</span>' +
              '<span class="s-name-inline">' + s + '</span>' +
              (lids.length ? '<span class="lid">LID ' + lids.join('、') + '</span>' : '') +
              (addr ? '<span class="addr">' + addr + '</span>' : '') +
              (smodAlarms.length ? '<span class="eac-smod">SMOD 外部告警：' + smodAlarms.join('、') + '</span>' : '') +
              (meters.length ? meters.map(m=>outageBadge(m)).join('') : '') +
              (secs[i] ? '<span class="sec">' + secs[i] + '</span>' : '') +
              (coord ? '<span class="coord2">' + coord.lat + ', ' + coord.lon + '</span>' : '') +
              (cells.length ? '<span class="toggle" data-idx="' + i + '">檢視細胞詳情 ▸</span>' : '') +
              (coord ? '<a class="mapbtn" target="_blank" rel="noopener" href="https://www.google.com/maps?q=' +
                coord.lat + ',' + coord.lon + '">Google 地圖</a>' : '');
            wrap.appendChild(bar);

            if (stationTown === '苗栗市') {
              wrap.appendChild(createPhotoArea(s));
            }

            if (cells.length) {
              const detail = document.createElement('div');
              detail.className = 'detail';
              detail.id = 'detail-' + i;
              detail.innerHTML = buildCellDetail(item, s, coord);
              wrap.appendChild(detail);
            }

            outStations.appendChild(wrap);
          });

          const note = document.createElement('div');
          note.className = 'note';
          note.textContent = '點擊「檢視細胞詳情」可展開細胞資訊；「Google 地圖」可開啟位置';
          outStations.appendChild(note);

          outStations.querySelectorAll('.toggle').forEach(tgl => {
            tgl.addEventListener('click', () => {
              const d = document.getElementById('detail-' + tgl.dataset.idx);
              if (d) {
                const shown = d.classList.toggle('show');
                tgl.textContent = shown ? '收合細胞詳情 ▾' : '檢視細胞詳情 ▸';
              }
            });
          });
        } else {
          outStations.innerHTML = '<div class="placeholder">無站台資料</div>';
        }

        outMeta.innerHTML =
          'RAN 型態：' + (item.ranType || '-') +
          (item.sec ? '　｜　扇區全貌：' + item.sec : '');

        result.classList.add('show');
      }

      function findItem() {
        const id = idInput.value.trim();
        if (!id) { result.classList.remove('show'); return null; }
        const item = data.find(d => d.id === id);
        if (!item) {
          outName.textContent = '查無此台號';
          outName.style.color = '#c0392b';
          outStations.innerHTML = '';
          outMeta.innerHTML = '';
          result.classList.add('show');
          return null;
        }
        outName.style.color = '';
        return item;
      }

      function selectById(id) {
        idInput.value = id;
        idInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        idInput.focus();
        const item = data.find(d => d.id === id);
        if (item) render(item);
      }

      function renderSearch(q) {
        const keyword = q.trim();
        const town = searchTown.value;
        if (!keyword) {
          searchResults.classList.remove('show');
          searchResults.innerHTML = '';
          searchCount.textContent = '';
          return;
        }
        const matches = stationIndex.filter(s =>
          (s.name.toLowerCase().indexOf(keyword.toLowerCase()) !== -1 ||
           s.siteNameCV.toLowerCase().indexOf(keyword.toLowerCase()) !== -1) &&
          (!town || s.town === town)
        );
        if (matches.length === 0) {
          searchResults.classList.add('show');
          searchResults.innerHTML = '<div class="center-hint">找不到符合的站台</div>';
          searchCount.textContent = '找到 0 筆';
          return;
        }
        searchCount.textContent = '找到 ' + matches.length + ' 筆站台';
        searchResults.innerHTML = '';
        matches.forEach(m => {
          const div = document.createElement('div');
          div.className = 'search-item';
          div.innerHTML =
            '<span class="s-arrow">›</span>' +
            '<div class="s-name">' + m.name + '</div>' +
            '<div class="s-meta">台號 ' + m.id + (m.sec ? '　｜　扇區 ' + m.sec : '') +
              '　｜　' + (m.town || '') +
              '　｜　' + (m.siteNameCV || '') + '</div>';
          div.addEventListener('click', () => selectById(m.id));
          searchResults.appendChild(div);
        });
        searchResults.classList.add('show');
      }

      idInput.addEventListener('input', () => { const it = findItem(); if (it) render(it); });
      idInput.addEventListener('change', () => { const it = findItem(); if (it) render(it); });
      searchInput.addEventListener('input', () => renderSearch(searchInput.value));
      searchTown.addEventListener('change', () => renderSearch(searchInput.value));
    }

    // 頁籤切換
    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById('panel-' + tab.dataset.net).classList.add('active');
        if (tab.dataset.net === 'map') { initCoverageMap(); }
      });
    });

    // ============ 涵蓋地圖（Leaflet + GeoJSON） ============
    let covMap = null, covLayers = {}, covLoaded = false, requestLocateRef = null;

    function initCoverageMap() {
      if (covLoaded) {
        if (covMap) setTimeout(() => covMap.invalidateSize(), 50);
        if (requestLocateRef) requestLocateRef();
        return;
      }
      covLoaded = true;
      if (typeof L === 'undefined') { console.log('Leaflet 未載入'); return; }

      covMap = L.map('coverageMap', {
        center: [24.54, 120.90],
        zoom: 11,
        zoomControl: true,
        attributionControl: true
      });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(covMap);

      // ============ GPS 定位 ============
      let locateMarker = null, locateCircle = null, hasLocated = false;
      const locBtn = document.getElementById('btnLocate');
      const locStatus = document.getElementById('locateStatus');

      function setLocStatus(msg, cls) {
        locStatus.textContent = msg || '';
        locStatus.className = 'locate-status' + (cls ? ' ' + cls : '');
      }
      function placeLocate(lat, lng, acc) {
        if (locateMarker) covMap.removeLayer(locateMarker);
        if (locateCircle) covMap.removeLayer(locateCircle);
        locateCircle = L.circle([lat, lng], {
          radius: acc || 30,
          color: '#c0392b', weight: 1.5,
          fillColor: '#c0392b', fillOpacity: 0.08,
          interactive: false
        }).addTo(covMap);
        locateMarker = L.circleMarker([lat, lng], {
          radius: 7,
          color: '#fff', weight: 2,
          fillColor: '#c0392b', fillOpacity: 1
        }).addTo(covMap);
        if (!hasLocated) {
          covMap.setView([lat, lng], Math.max(14, covMap.getZoom()), { animate: false });
          hasLocated = true;
        } else {
          covMap.setView([lat, lng], Math.max(14, covMap.getZoom()), { animate: true });
        }
      }
      function requestLocate(autofit) {
        if (!('geolocation' in navigator)) {
          setLocStatus('此裝置不支援 GPS 定位', 'err');
          return;
        }
        locBtn.disabled = true;
        setLocStatus('正在取得 GPS 位置…');
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            locBtn.disabled = false;
            const lat = pos.coords.latitude, lng = pos.coords.longitude;
            placeLocate(lat, lng, pos.coords.accuracy);
            setLocStatus('📍 已定位：' + lat.toFixed(5) + ', ' + lng.toFixed(5) +
              '（誤差約 ' + Math.round(pos.coords.accuracy) + ' 公尺）', 'ok');
          },
          (err) => {
            locBtn.disabled = false;
            const msg = {
              1: '定位權限被拒絕，請允許存取位置',
              2: '無法取得位置（GPS 訊號不佳）',
              3: '定位逾時'
            }[err.code] || '定位失敗：' + err.message;
            setLocStatus(msg, 'err');
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
        );
      }
      locBtn.addEventListener('click', () => requestLocate());
      requestLocateRef = requestLocate;
      requestLocate(); // 進入地圖時自動定位

      const style4g = {
        color: '#2f6fad', weight: 1, opacity: 0.9,
        fillColor: '#2f6fad', fillOpacity: 0.45
      };
      const style5g = {
        color: '#2e7d32', weight: 1, opacity: 0.9,
        fillColor: '#2e7d32', fillOpacity: 0.4
      };

      function sectorPopup(p) {
        const t = p.properties;
        return '<div style="font-size:13px; line-height:1.7;">' +
          '<b>' + escapeHtml(t.cell || '') + '</b>（' + escapeHtml(t.kind) + '）<br>' +
          '站台：' + escapeHtml(t.site || '-') + '<br>' +
          '方位角：' + escapeHtml(t.az || '-') + '°　涵蓋：' + escapeHtml((t.cov || '-').split(';')[0]) + '<br>' +
          (t.freq ? '頻段：' + escapeHtml(t.freq) + '<br>' : '') +
          (t.rmod ? '模組：' + escapeHtml(t.rmod) + '<br>' : '') +
          (t.tilt ? '傾角：' + escapeHtml(t.tilt) : '') +
          '</div>';
      }
      function pointPopup(p) {
        const t = p.properties;
        return '<div style="font-size:13px; line-height:1.7;">' +
          '<b>' + escapeHtml(t.site || t.bts || '') + '</b><br>' +
          '台號：' + escapeHtml(t.bts || '-') + '（' + escapeHtml(t.kind) + '）<br>' +
          (t.namechs ? '名稱：' + escapeHtml(t.namechs) + '<br>' : '') +
          (t.region ? '區域：' + escapeHtml(t.region) : '') +
          '</div>';
      }

      // 頻段判斷規則（依 CellName 結尾）
      const BAND_RULES = {
        '4g': {
          L900:  c => /[17]$/.test(c),
          L1800: c => /[23]$/.test(c),
          L2600: c => /[45]$/.test(c),
          L2100: c => /6$/.test(c)
        },
        '5g': {
          N2100: c => /06$/.test(c),
          N3500: c => /11$/.test(c)
        }
      };

      const LABEL_ZOOM = 13;
      const PCI_ZOOM = 16;
      let btsLabels = null;
      let pciLabels = null;

      // 依 cell 名稱解析射向（4G: cell = bts + 射向 + 頻段，如 41778611 => 射向1）
      const sectorOf = (cell) => {
        const s = String(cell || '');
        return s.length >= 2 ? s[s.length - 2] : s;
      };

      // 計算扇形中心（ring 中重複最多的點即站台中心）
      const ringCenter = (ring) => {
        const counts = {};
        ring.forEach(pt => {
          const k = pt[0].toFixed(5) + ',' + pt[1].toFixed(5);
          counts[k] = (counts[k] || 0) + 1;
        });
        let best = null, bestN = 0;
        Object.keys(counts).forEach(k => {
          if (counts[k] > bestN) { bestN = counts[k]; best = k; }
        });
        const [lng, lat] = best.split(',').map(Number);
        return [lat, lng];
      };

      // 射向中心線位置：沿方位角方向，貼在扇形最外側（PCI 顯示在扇形外緣）
      const tipPos = (ring, center, az) => {
        const [clat, clng] = center;
        const arc = ring.slice(0, 8);
        const r = arc.reduce((s, pt) =>
          s + Math.hypot(pt[1] - clat, pt[0] - clng), 0) / arc.length;
        const rad = az * Math.PI / 180;
        const lat = clat + Math.cos(rad) * r * 1.0;
        const lng = clng + Math.sin(rad) * r * 1.0;
        return [lat, lng];
      };

      // 4G：每個站台位置放台號、每個射向放 PCI 標籤（以位置+射向去重，INDOOR 不顯示）
      // 台號與 PCI 分屬兩個圖層：台號 zoom>=LABEL_ZOOM 顯示，PCI zoom>=PCI_ZOOM 才顯示
      const build4gLabels = (features) => {
        const sites = {};
        const pcis = {};
        const btsMk = [];
        const pciMk = [];
        features.forEach(f => {
          const p = f.properties;
          const ring = f.geometry.coordinates[0];
          const center = ringCenter(ring);
          const centerKey = center[0].toFixed(5) + ',' + center[1].toFixed(5);
          const siteKey = p.bts + '|' + centerKey;
          if (!sites[siteKey]) {
            sites[siteKey] = true;
            btsMk.push(L.marker(center, {
              icon: L.divIcon({
                className: 'cov-bts-label',
                html: escapeHtml(p.bts),
                iconSize: null
              }),
              interactive: false
            }));
          }
          if (p.pci != null && (p.celltype || '').indexOf('INDOOR') === -1) {
            const sec = sectorOf(p.cell);
            const key = p.bts + '|' + centerKey + '|' + sec;
            if (!pcis[key]) {
              pcis[key] = true;
              const pos = tipPos(ring, center, parseFloat(p.az) || 0);
              pciMk.push(L.marker(pos, {
                icon: L.divIcon({
                  className: 'cov-pci-label',
                  html: escapeHtml(p.pci),
                  iconSize: null
                }),
                interactive: false
              }));
            }
          }
        });
        btsLabels = L.layerGroup(btsMk);
        pciLabels = L.layerGroup(pciMk);
        return btsLabels;
      };

      // 依縮放級別顯示/隱藏台號與 PCI 標籤
      function applyLabelVisibility() {
        const z = covMap.getZoom();
        const chk = document.getElementById('chk4g').checked;
        if (btsLabels) {
          const showBts = chk && z >= LABEL_ZOOM;
          if (showBts && !covMap.hasLayer(btsLabels)) btsLabels.addTo(covMap);
          if (!showBts && covMap.hasLayer(btsLabels)) covMap.removeLayer(btsLabels);
        }
        if (pciLabels) {
          const showPci = chk && z >= PCI_ZOOM;
          if (showPci && !covMap.hasLayer(pciLabels)) pciLabels.addTo(covMap);
          if (!showPci && covMap.hasLayer(pciLabels)) pciLabels.removeFrom(covMap);
        }
      }
      covMap.on('zoomend', applyLabelVisibility);

      const loadSectors = (kind, url, style, name) => new Promise((resolve) => {
        fetch(url).then(r => r.json()).then(geo => {
          const rules = BAND_RULES[kind];
          const towns = {};
          geo.features.forEach(f => {
            const t = f.properties.town || '其他';
            if (!towns[t]) towns[t] = {};
            const c = f.properties.cell || '';
            Object.keys(rules).forEach(b => {
              if (rules[b](c)) {
                if (!towns[t][b]) towns[t][b] = [];
                towns[t][b].push(f);
              }
            });
          });
          const byTown = {};
          Object.keys(towns).forEach(t => {
            byTown[t] = {};
            Object.keys(towns[t]).forEach(b => {
              byTown[t][b] = L.geoJSON({
                type: 'FeatureCollection',
                features: towns[t][b]
              }, {
                style,
                onEachFeature: (feat, l) => l.bindPopup(sectorPopup(feat))
              });
            });
          });
          const extra = { kind, byTown, style };
          if (name === '4g') extra.labels = build4gLabels(geo.features);
          covLayers[name] = extra;
          fillTownOptions(geo.features);
          resolve();
        }).catch(() => resolve());
      });
      const loadPoints = (kind, url, name) => new Promise((resolve) => {
        fetch(url).then(r => r.json()).then(geo => {
          const byTown = {};
          geo.features.forEach(f => {
            const t = f.properties.town || '其他';
            if (!byTown[t]) byTown[t] = [];
            byTown[t].push(f);
          });
          const layers = {};
          Object.keys(byTown).forEach(t => {
            layers[t] = L.geoJSON({
              type: 'FeatureCollection',
              features: byTown[t]
            }, {
              pointToLayer: (feat, latlng) =>
                L.circleMarker(latlng, {
                  radius: 4,
                  color: '#fff', weight: 1,
                  fillColor: kind === '4g' ? '#1a3a5c' : '#e65100',
                  fillOpacity: 0.9
                }),
              onEachFeature: (feat, l) => l.bindPopup(pointPopup(feat))
            });
          });
          covLayers[name] = { byTown: layers };
          fillTownOptions(geo.features);
          resolve();
        }).catch(() => resolve());
      });

      // 收集鄉鎮清單填入下拉
      function fillTownOptions(features) {
        const sel = document.getElementById('selTown');
        if (!sel || sel.dataset.filled) return;
        const towns = new Set();
        features.forEach(f => {
          const t = f.properties.town;
          if (t) towns.add(t);
        });
        if (!towns.size) return;
        const order = [...towns].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
        order.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          sel.appendChild(opt);
        });
        sel.dataset.filled = '1';
      }

      // 依 checkbox + 頻段 + 鄉鎮顯示/隱藏扇形與點位
      function applySectorVisibility() {
        const town = document.getElementById('selTown').value;
        ['4g', '5g'].forEach(net => {
          const g = covLayers[net];
          if (!g) return;
          const chk = document.getElementById('chk' + net).checked;
          const band = document.getElementById('sel' + net + 'Band').value;
          Object.keys(g.byTown).forEach(t => {
            Object.keys(g.byTown[t]).forEach(b => {
              const layer = g.byTown[t][b];
              const show = chk && (band === 'all' || band === b)
                && (town === 'all' || t === town);
              if (show && !covMap.hasLayer(layer)) layer.addTo(covMap);
              if (!show && covMap.hasLayer(layer)) covMap.removeLayer(layer);
            });
          });
        });
        const chkPoints = document.getElementById('chkPoints').checked;
        const sel = document.getElementById('selPointNet').value;
        [['p4g', '4g'], ['p5g', '5g']].forEach(([name, net]) => {
          const g = covLayers[name];
          if (!g) return;
          Object.keys(g.byTown).forEach(t => {
            const layer = g.byTown[t];
            const show = chkPoints && (sel === 'both' || sel === net)
              && (town === 'all' || t === town);
            if (show && !covMap.hasLayer(layer)) layer.addTo(covMap);
            if (!show && covMap.hasLayer(layer)) covMap.removeLayer(layer);
          });
        });
        applyLabelVisibility();
      }

      document.getElementById('mapLoading').style.display = 'block';
      Promise.all([
        loadSectors('4g', 'geo/geo_4g_sectors.json', style4g, '4g'),
        loadSectors('5g', 'geo/geo_5g_sectors.json', style5g, '5g'),
        loadPoints('4g', 'geo/geo_4g_points.json', 'p4g'),
        loadPoints('5g', 'geo/geo_5g_points.json', 'p5g')
      ]).then(() => {
        applySectorVisibility();
        document.getElementById('mapLoading').style.display = 'none';
        if (covLayers['4g'] && !hasLocated) {
          const firstTown = covLayers['4g'].byTown;
          let first = null;
          Object.keys(firstTown).forEach(t => {
            if (!first && firstTown[t]['L900']) first = firstTown[t]['L900'];
          });
          if (first) covMap.fitBounds(first.getBounds().pad(0.05));
        }
      });

      const togglePoints = (on) => {
        const sel = document.getElementById('selPointNet').value;
        const town = document.getElementById('selTown').value;
        [['p4g', '4g'], ['p5g', '5g']].forEach(([name, net]) => {
          const g = covLayers[name];
          if (!g) return;
          Object.keys(g.byTown).forEach(t => {
            const layer = g.byTown[t];
            const show = on && (sel === 'both' || sel === net)
              && (town === 'all' || t === town);
            if (show && !covMap.hasLayer(layer)) layer.addTo(covMap);
            if (!show && covMap.hasLayer(layer)) covMap.removeLayer(layer);
          });
        });
      };

      document.getElementById('chk4g').addEventListener('change', applySectorVisibility);
      document.getElementById('chk5g').addEventListener('change', applySectorVisibility);
      document.getElementById('sel4gBand').addEventListener('change', applySectorVisibility);
      document.getElementById('sel5gBand').addEventListener('change', applySectorVisibility);
      document.getElementById('selTown').addEventListener('change', applySectorVisibility);
      document.getElementById('chkPoints').addEventListener('change', e => togglePoints(e.target.checked));
      document.getElementById('selPointNet').addEventListener('change', () => togglePoints(document.getElementById('chkPoints').checked));
      document.getElementById('sel4gMode').addEventListener('change', e => {
        const on = document.getElementById('chk4g').checked;
        const newUrl = e.target.value === 'ue'
          ? 'geo/geo_4g_ue_sectors.json' : 'geo/geo_4g_sectors.json';
        const old = covLayers['4g'];
        if (old) {
          Object.keys(old.byTown || {}).forEach(t => {
            Object.keys(old.byTown[t]).forEach(b => {
              const layer = old.byTown[t][b];
              if (covMap.hasLayer(layer)) covMap.removeLayer(layer);
            });
          });
          if (old.labels && covMap.hasLayer(old.labels)) covMap.removeLayer(old.labels);
          if (pciLabels && covMap.hasLayer(pciLabels)) covMap.removeLayer(pciLabels);
          if (btsLabels && covMap.hasLayer(btsLabels)) covMap.removeLayer(btsLabels);
          btsLabels = null;
          pciLabels = null;
          delete covLayers['4g'];
        }
        const st = (old && old.style) || style4g;
        loadSectors('4g', newUrl, st, '4g').then(() => {
          applySectorVisibility();
        });
      });
    }

    // PWA 離線支援
    createNetController({
      data: STATION_DATA,
      idInput: document.getElementById('idInput4g'),
      idList: document.getElementById('idList4g'),
      result: document.getElementById('result4g'),
      outName: document.getElementById('outName4g'),
      outStations: document.getElementById('outStations4g'),
      outMeta: document.getElementById('outMeta4g'),
      searchInput: document.getElementById('searchInput4g'),
      searchTown: document.getElementById('searchTown4g'),
      searchResults: document.getElementById('searchResults4g'),
      searchCount: document.getElementById('searchCount4g'),
      idLabel: 'lnCelId'
    });

    createNetController({
      data: STATION_DATA_5G,
      idInput: document.getElementById('idInput5g'),
      idList: document.getElementById('idList5g'),
      result: document.getElementById('result5g'),
      outName: document.getElementById('outName5g'),
      outStations: document.getElementById('outStations5g'),
      outMeta: document.getElementById('outMeta5g'),
      searchInput: document.getElementById('searchInput5g'),
      searchTown: document.getElementById('searchTown5g'),
      searchResults: document.getElementById('searchResults5g'),
      searchCount: document.getElementById('searchCount5g'),
      idLabel: 'nrCelId'
    });

    // PWA 離線支援
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.log('SW registration failed:', err);
        });
      });
    }

    // ============ Lightbox swipe navigation ============
    let lb, lbImg, lbCaption, lbClose, lbPrev, lbNext;
    let lbList = [], lbIndex = 0;
    let lbStartX = 0, lbStartY = 0;
    function ensureLb(){
      if(lb) return;
      lb = document.getElementById('lightbox');
      lbImg = document.getElementById('lbImg');
      lbCaption = document.getElementById('lbCaption');
      lbClose = document.getElementById('lbClose');
      lbPrev = document.getElementById('lbPrev');
      lbNext = document.getElementById('lbNext');
      if(!lb) return;
      lbClose.addEventListener('click', closeLightbox);
      lb.addEventListener('click', (e)=>{ if(e.target===lb) closeLightbox(); });
      lbPrev.addEventListener('click', (e)=>{ e.stopPropagation(); lbStep(-1); });
      lbNext.addEventListener('click', (e)=>{ e.stopPropagation(); lbStep(1); });
      document.addEventListener('keydown', (e)=>{
        if(!lb || !lb.classList.contains('show')) return;
        if(e.key==='Escape') closeLightbox();
        if(e.key==='ArrowLeft') lbStep(-1);
        if(e.key==='ArrowRight') lbStep(1);
      });
      lb.addEventListener('touchstart', (e)=>{
        const t=e.touches[0];
        lbStartX=t.clientX; lbStartY=t.clientY;
      }, {passive:true});
      lb.addEventListener('touchend', (e)=>{
        const t=e.changedTouches[0];
        const dx=t.clientX - lbStartX;
        const dy=t.clientY - lbStartY;
        if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
          lbStep(dx<0?1:-1);
        }
      }, {passive:true});
      // 桌機滑鼠拖曳（左右滑動）
      lb.addEventListener('mousedown', (e)=>{
        lbStartX=e.clientX; lbStartY=e.clientY;
        lb._dragging = true;
        lb.style.cursor='grabbing';
        e.preventDefault();
      });
      lb.addEventListener('mouseup', (e)=>{
        if(!lb._dragging) return;
        lb._dragging = false;
        lb.style.cursor='grab';
        const dx=e.clientX - lbStartX;
        const dy=e.clientY - lbStartY;
        if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
          lbStep(dx<0?1:-1);
        }
      });
      lb.addEventListener('mouseleave', ()=>{ lb._dragging=false; lb.style.cursor='grab'; });
      lb.style.cursor='grab';
    }
    function openLightbox(list, index){
      ensureLb();
      lbList = list; lbIndex = index;
      updateLightbox();
      lb.classList.add('show');
      lb.setAttribute('aria-hidden','false');
      document.body.style.overflow='hidden';
    }
    function updateLightbox(){
      ensureLb();
      const p = lbList[lbIndex];
      lbImg.src = PHOTO_SERVER + p.url;
      lbImg.alt = p.name;
      lbCaption.textContent = (lbIndex+1)+' / '+lbList.length+'  '+p.name;
      lbPrev.style.visibility = lbList.length>1 ? 'visible' : 'hidden';
      lbNext.style.visibility = lbList.length>1 ? 'visible' : 'hidden';
    }
    function closeLightbox(){
      ensureLb();
      lb.classList.remove('show');
      lb.setAttribute('aria-hidden','true');
      document.body.style.overflow='';
    }
    function lbStep(d){
      lbIndex = (lbIndex + d + lbList.length) % lbList.length;
      updateLightbox();
    }
  </script>
<div id="lightbox" class="lightbox" aria-hidden="true">
  <span class="lb-close" id="lbClose">&times;</span>
  <span class="lb-nav lb-prev" id="lbPrev">&#10094;</span>
  <img id="lbImg" alt="">
  <span class="lb-nav lb-next" id="lbNext">&#10095;</span>
  <div class="lb-caption" id="lbCaption"></div>
</div>
</body>
</html>
