<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>4G / 5G 台號站台查詢</title>
<meta name="description" content="依台號查詢台名、站台與細胞詳細資料">
<meta name="theme-color" content="#2f6fad">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #f0f4f8;
    --primary: #2f6fad;
    --primary-dark: #1a3a5c;
    --card-bg: #fff;
    --max-w: 680px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(12px, 3vw, 32px) 16px;
    padding-top: calc(clamp(12px, 3vw, 32px) + env(safe-area-inset-top));
  }
  h1 { color: var(--primary-dark); margin-bottom: 8px; font-size: clamp(20px, 4.5vw, 28px); text-align: center; }
  .subtitle { color: #5a7a9a; margin-bottom: clamp(12px, 3vw, 24px); font-size: 14px; text-align: center; }

  .tabs {
    display: flex;
    background: var(--card-bg);
    border-radius: 12px 12px 0 0;
    box-shadow: 0 4px 16px rgba(26,58,92,.12);
    width: 100%;
    max-width: var(--max-w);
    overflow: hidden;
  }
  .tab {
    flex: 1;
    padding: 14px 16px;
    text-align: center;
    font-size: clamp(15px, 4vw, 17px);
    font-weight: 700;
    color: #6b8aa8;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color .2s, border-color .2s, background .2s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tab:hover { color: var(--primary); }
  .tab.active { color: var(--primary-dark); border-bottom-color: var(--primary); background: #f7fafc; }

  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--card-bg);
    border-radius: 0 0 12px 12px;
    box-shadow: 0 4px 16px rgba(26,58,92,.12);
    width: 100%;
    max-width: var(--max-w);
    padding: clamp(16px, 3.5vw, 28px);
  }
  label { display: block; font-weight: 700; color: var(--primary-dark); margin-bottom: 8px; font-size: 15px; }
  input {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border: 2px solid #c8d6e4;
    border-radius: 8px;
    background: #fafcfe;
    color: var(--primary-dark);
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--primary); }
  .hint { font-size: 12px; color: #8aa4bd; margin-top: 6px; }
  .result {
    margin-top: 24px;
    border-top: 1px solid #e2eaf2;
    padding-top: 20px;
    display: none;
  }
  .result.show { display: block; }
  .field { margin-bottom: 18px; }
  .field .key { font-size: 13px; color: #6b8aa8; font-weight: 600; margin-bottom: 6px; }
  .field .value { font-size: clamp(16px, 3.5vw, 18px); color: var(--primary-dark); font-weight: 700; }
  .field .value small { font-weight: 400; color: #7893ad; }
  .note { font-size: 12px; color: #8aa4bd; margin-top: 10px; }
  .meta { font-size: 13px; color: #5a7a9a; line-height: 1.8; }
  .placeholder { text-align: center; color: #9ab0c4; padding: 12px 0; }
  .center-hint { text-align: center; color: #9ab0c4; padding: 10px 0; }

  .search-results {
    background: var(--card-bg);
    border: 2px solid #c8d6e4;
    border-radius: 8px;
    margin-top: 6px;
    max-height: min(260px, 45vh);
    overflow-y: auto;
    display: none;
    -webkit-overflow-scrolling: touch;
  }
  .search-results.show { display: block; }
  .search-item {
    padding: 12px 14px;
    cursor: pointer;
    border-bottom: 1px solid #eef3f8;
    transition: background .15s;
  }
  .search-item:last-child { border-bottom: none; }
  .search-item:hover, .search-item:active { background: #e8f1fa; }
  .search-item .s-name { font-size: 14px; color: var(--primary-dark); font-weight: 700; }
  .search-item .s-meta { font-size: 12px; color: #6b8aa8; margin-top: 2px; }
  .search-item .s-arrow { float: right; color: var(--primary); font-weight: 700; }
  .search-count { font-size: 12px; color: #8aa4bd; margin-top: 6px; }

  .station-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    background: #e8f1fa;
    border: 1px solid #c6d9ec;
    border-radius: 8px;
    padding: 8px 12px;
    gap: 6px;
    font-size: clamp(13px, 3.2vw, 15px);
    color: var(--primary-dark);
  }
  .station-bar .num {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    border-radius: 50%;
    width: 20px; height: 20px;
    line-height: 20px;
    text-align: center;
    font-size: 12px;
    margin-right: 4px;
    flex-shrink: 0;
  }
  .station-bar .s-name-inline { font-weight: 700; word-break: break-all; }
  .station-bar .lid {
    display: inline-block;
    background: #eef7ee;
    color: #2e7d32;
    border: 1px solid #b8dcc0;
    border-radius: 12px;
    padding: 1px 10px;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .station-bar .sec {
    background: #fff;
    color: var(--primary);
    border: 1px solid #b6d0e8;
    border-radius: 12px;
    padding: 1px 8px;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .station-bar .meter {
    display: inline-block;
    background: #fff8e6;
    color: #b7791f;
    border: 1px solid #ecd7a0;
    border-radius: 12px;
    padding: 1px 10px;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .station-bar .addr {
    display: inline-block;
    background: #eef4fb;
    color: #3a5c7e;
    border: 1px solid #c9dcef;
    border-radius: 12px;
    padding: 1px 10px;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .station-bar .eac-smod {
    display: inline-block;
    background: #fdecea;
    color: #b0301c;
    border: 1px solid #efc1b8;
    border-radius: 12px;
    padding: 1px 10px;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .station-bar .coord2 { font-size: 11px; color: #6b8aa8; margin-left: 4px; }
  .station-bar .toggle {
    cursor: pointer;
    color: var(--primary);
    font-weight: 700;
    font-size: 13px;
    margin-left: auto;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .station-bar .toggle:hover { text-decoration: underline; }
  .station-bar .mapbtn {
    display: inline-block;
    background: #fff;
    color: #c0392b;
    border: 1px solid #e8c4bc;
    border-radius: 12px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
  }
  .station-bar .mapbtn:hover { background: #fdf0ee; }

  .photo-area {
    margin-top: 6px;
    margin-left: 30px;
    background: #fbfcfd;
    border: 1px solid #e2ecf4;
    border-radius: 12px;
    padding: 10px;
  }
  .photo-area .photo-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 8px;
  }
  .photo-area .photo-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .photo-area .photo-grid img {
    width: 76px;
    height: 76px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #d5e2ee;
    background: #eef4f9;
  }
  .photo-area .photo-grid a.photo-more {
    width: 76px;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px dashed #b9cfe3;
    border-radius: 8px;
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
  }
  .photo-area .photo-empty {
    font-size: 12px;
    color: #8ba0b4;
  }
  .photo-area .photo-actions { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .photo-area .upload-btn {
    display: inline-block;
    background: #eaf3fb;
    color: var(--primary);
    border: 1px solid #bfd8ec;
    border-radius: 12px;
    padding: 3px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
  }
  .photo-area .upload-btn:hover { background: #dcebf8; }
  .photo-area .photo-hint { font-size: 11px; color: #8ba0b4; }
  .photo-area .photo-status { font-size: 12px; color: #2e7d32; font-weight: 700; }
  .photo-area .photo-status.err { color: #c0392b; }

  .detail {
    display: none;
    margin-top: 6px;
    padding: 14px;
    background: #f7fafc;
    border: 1px solid #dbe6f0;
    border-radius: 10px;
  }
  .detail.show { display: block; }
  .detail-title { font-size: 14px; font-weight: 700; color: var(--primary-dark); margin-bottom: 10px; }
  .cell-sec { margin-bottom: 12px; }
  .cell-sec:last-child { margin-bottom: 0; }
  .cell-sec-title { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
  .cell-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .cell-card {
    background: #fff;
    border: 1px solid #d4e2f0;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--primary-dark);
    min-width: 120px;
    flex: 1 1 auto;
  }
  .cell-card .c-id { font-weight: 700; font-size: 14px; color: var(--primary-dark); }
  .cell-card .c-rmod {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    border-radius: 4px;
    padding: 1px 8px;
    font-size: 12px;
    font-weight: 700;
    margin-top: 4px;
  }
  .cell-card .c-cov {
    display: inline-block;
    border-radius: 4px;
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 700;
    margin-left: 4px;
  }
  .cell-card .c-cov.outdoor { background: #e3f2e3; color: #2e7d32; border: 1px solid #b7dfb9; }
  .cell-card .c-cov.indoor { background: #fff3e0; color: #e65100; border: 1px solid #f3c894; }
  .cell-card .c-meta { font-size: 11px; color: #6b8aa8; margin-top: 4px; line-height: 1.5; }
  .cell-card .c-map a { color: #c0392b; text-decoration: none; font-size: 11px; font-weight: 600; }
  .cell-card .c-map a:hover { text-decoration: underline; }
  .cell-card .c-eac {
    display: inline-block;
    background: #fdecea;
    color: #b0301c;
    border: 1px solid #efc1b8;
    border-radius: 4px;
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 700;
    margin-top: 4px;
  }

  @media (min-width: 760px) {
    :root { --max-w: 720px; }
    .card, .tabs { max-width: 720px; }
    .cell-card { min-width: 200px; }
  }

  @media (max-width: 480px) {
    .station-bar .mapbtn { width: 100%; text-align: center; }
    .station-bar .toggle { margin-left: 0; }
    .station-bar { gap: 4px; }
  }
</style>
</head>
<body>
  <h1>4G / 5G 台號站台查詢</h1>
  <div class="subtitle">苗栗基維股 · 依台號查詢台名、站台與細胞詳細資料</div>

  <div class="tabs">
    <div class="tab active" data-net="4g" id="tab4g">4G</div>
    <div class="tab" data-net="5g" id="tab5g">5G</div>
  </div>

  <div class="panel active" id="panel-4g">
    <div class="card">
      <label for="idInput4g">4G 台號 (lnBtsId)</label>
      <input id="idInput4g" list="idList4g" placeholder="輸入或選擇 4G 台號" autocomplete="off">
      <datalist id="idList4g"></datalist>
      <div class="hint">可直接輸入 lnBtsId，或從下拉清單中選擇</div>

      <div id="result4g" class="result">
        <div class="field">
          <div class="key">站名 (SiteName)</div>
          <div class="value" id="outName4g"></div>
        </div>
        <div class="field">
          <div class="key">台名 (lnBtsIdLL_NameChs)</div>
          <div id="outStations4g"></div>
        </div>
        <div class="field meta" id="outMeta4g"></div>
      </div>
    </div>

    <div class="card" style="margin-top: 16px;">
      <label for="searchInput4g">站台名稱搜尋 (lnBtsIdLL_NameChs)</label>
      <input id="searchInput4g" placeholder="輸入站台名稱關鍵字" autocomplete="off">
      <div class="search-count" id="searchCount4g"></div>
      <div class="search-results" id="searchResults4g"></div>
      <div class="hint">輸入站台名稱可找到對應的 4G 台號，點擊結果即顯示該站台詳情</div>
    </div>
  </div>

  <div class="panel" id="panel-5g">
    <div class="card">
      <label for="idInput5g">5G 台號 (nrBtsId)</label>
      <input id="idInput5g" list="idList5g" placeholder="輸入或選擇 5G 台號" autocomplete="off">
      <datalist id="idList5g"></datalist>
      <div class="hint">可直接輸入 nrBtsId，或從下拉清單中選擇</div>

      <div id="result5g" class="result">
        <div class="field">
          <div class="key">站名 (SiteName)</div>
          <div class="value" id="outName5g"></div>
        </div>
        <div class="field">
          <div class="key">台名 (nrBtsIdNN_NameChs)</div>
          <div id="outStations5g"></div>
        </div>
        <div class="field meta" id="outMeta5g"></div>
      </div>
    </div>

    <div class="card" style="margin-top: 16px;">
      <label for="searchInput5g">站台名稱搜尋 (nrBtsIdNN_NameChs)</label>
      <input id="searchInput5g" placeholder="輸入站台名稱關鍵字" autocomplete="off">
      <div class="search-count" id="searchCount5g"></div>
      <div class="search-results" id="searchResults5g"></div>
      <div class="hint">輸入站台名稱可找到對應的 5G 台號，點擊結果即顯示該站台詳情</div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="data5g.js"></script>
  <script>
    // ============ 站台照片（本機照片伺服器） ============
    // 照片伺服器網址。改用自己的網址（如之後改 Graph 代理）時可在這裡設定。
    const PHOTO_SERVER = window.PHOTO_SERVER || 'http://localhost:8000';

    function photoApi(station, path) {
      return PHOTO_SERVER + path + '?station=' + encodeURIComponent(station);
    }

    async function loadPhotos(station, gridEl, statusEl) {
      try {
        const res = await fetch(photoApi(station, '/api/photos'));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        renderPhotos(station, data.photos || [], gridEl);
        if (statusEl) { statusEl.textContent = ''; statusEl.className = 'photo-status'; }
      } catch (e) {
        gridEl.innerHTML = '';
        if (statusEl) {
          statusEl.textContent = '⚠ 無法連線照片伺服器（請執行 照片伺服器.bat 並完成 Google Drive 授權）';
          statusEl.className = 'photo-status err';
        }
      }
    }

    function renderPhotos(station, photos, gridEl) {
      if (!photos.length) {
        gridEl.innerHTML = '<div class="photo-empty">尚無照片</div>';
        return;
      }
      const shown = photos.slice(0, 12);
      const rest = photos.length - shown.length;
      gridEl.innerHTML = '';
      shown.forEach(p => {
        const a = document.createElement('a');
        a.href = PHOTO_SERVER + p.url;
        a.target = '_blank';
        a.rel = 'noopener';
        const img = document.createElement('img');
        img.src = PHOTO_SERVER + p.url;
        img.alt = p.name;
        img.loading = 'lazy';
        a.appendChild(img);
        gridEl.appendChild(a);
      });
      if (rest > 0) {
        const a = document.createElement('a');
        a.className = 'photo-more';
        a.href = PHOTO_SERVER + '/api/photos?station=' + encodeURIComponent(station);
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = '+' + rest;
        gridEl.appendChild(a);
      }
    }

    function attachPhotoUpload(station, inputEl, gridEl, statusEl) {
      inputEl.addEventListener('change', async () => {
        const files = Array.from(inputEl.files || []);
        if (!files.length) return;
        statusEl.textContent = '上傳中…';
        statusEl.className = 'photo-status';
        const fd = new FormData();
        files.forEach(f => fd.append('files', f));
        try {
          const res = await fetch(photoApi(station, '/api/upload'), { method: 'POST', body: fd });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || '上傳失敗');
          statusEl.textContent = '已上傳 ' + data.saved.length + ' 張';
          statusEl.className = 'photo-status';
          inputEl.value = '';
          loadPhotos(station, gridEl, statusEl);
        } catch (e) {
          statusEl.textContent = '⚠ 上傳失敗：' + e.message;
          statusEl.className = 'photo-status err';
        }
      });
    }

    function createPhotoArea(station) {
      const el = document.createElement('div');
      el.className = 'photo-area';
      el.innerHTML =
        '<div class="photo-title">站台照片</div>' +
        '<div class="photo-grid"></div>' +
        '<div class="photo-actions">' +
        '<label class="upload-btn">📷 上傳照片<input type="file" accept="image/*" multiple hidden></label>' +
        '<span class="photo-hint">照片將存入 Google Drive「' + escapeHtml(station) + '/」資料夾</span>' +
        '<span class="photo-status"></span>' +
        '</div>';
      const gridEl = el.querySelector('.photo-grid');
      const statusEl = el.querySelector('.photo-status');
      const inputEl = el.querySelector('input[type=file]');
      const btnEl = el.querySelector('.upload-btn');
      if (btnEl) {
        btnEl.addEventListener('click', (ev) => {
          if (ev.target !== inputEl) { ev.preventDefault(); inputEl.click(); }
        });
      }
      attachPhotoUpload(station, inputEl, gridEl, statusEl);
      loadPhotos(station, gridEl, statusEl);
      return el;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function createNetController(cfg) {
      const {
        data, idInput, idList, result, outName, outStations, outMeta,
        searchInput, searchResults, searchCount, idLabel
      } = cfg;

      const stationIndex = [];
      data.forEach(item => {
        item.stations.forEach((s, i) => {
          stationIndex.push({
            name: s,
            id: item.id,
            siteNameCV: item.siteNameCV,
            sec: (item.sec && item.sec.split('_')[i]) || '',
            coord: (item.coords && item.coords[i]) || null
          });
        });
      });

      data.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.id + ' - ' + (item.siteNameCV || '');
        idList.appendChild(opt);
      });

      function buildCellDetail(item, station, coord) {
        const groups = item.cells[station] || [];
        let html = '<div class="detail-title">細胞詳細資料</div>';
        if (!groups.length) {
          html += '<div class="placeholder">無細胞資料</div>';
          return html;
        }
        const eacInfo = (item.eac && item.eac[station]) || null;
        const rmodCells = (eacInfo && eacInfo.rmod) ? eacInfo.rmod : {};
        groups.forEach(g => {
          html += '<div class="cell-sec">';
          html += '<div class="cell-sec-title">扇區 S' + g.sec + '</div>';
          html += '<div class="cell-row">';
          g.cells.forEach(c => {
            const cov = (c.cov || '');
            const covClass = cov.indexOf('Indoor') !== -1 ? 'indoor' : 'outdoor';
            const hasCellCoord = c.lat && c.lon;
            const mapHref = hasCellCoord
              ? 'https://www.google.com/maps?q=' + c.lat + ',' + c.lon
              : (coord ? 'https://www.google.com/maps?q=' + coord.lat + ',' + coord.lon : '');
            const rAlarms = rmodCells[String(c.cel)];
            const isEac = !!rAlarms;
            html += '<div class="cell-card"' + (isEac ? ' style="border-color:#efc1b8;background:#fff7f6;"' : '') + '>' +
              '<div class="c-id">' + idLabel + ' ' + c.cel + '</div>' +
              (isEac ? '<div class="c-eac">外部告警：' + rAlarms.join('、') + '</div>' : '') +
              '<div class="c-rmod">' + (c.rmod || '-') + '</div>' +
              '<div class="c-cov ' + covClass + '">' + cov + '</div>' +
              '<div class="c-meta">' +
              '方位角：' + (c.az || '-') + '°　上傾角：' + (c.mt || '-') + '°　下傾角：' + (c.et || '-') + '°' +
              (c.toff ? '<br>傾斜補償：' + c.toff + '°' : '') +
              (hasCellCoord ? '<br>座標：' + c.lat + ', ' + c.lon : '') +
              '</div>';
            if (mapHref) {
              html += '<div class="c-map"><a target="_blank" rel="noopener" href="' + mapHref + '">Google 地圖</a></div>';
            }
            html += '</div>';
          });
          html += '</div></div>';
        });
        return html;
      }

      function render(item) {
        outName.textContent = item.siteName || '-';
        outName.innerHTML = (item.siteName || '-') +
          (item.siteNameCV && item.siteName && item.siteNameCV !== item.siteName
            ? ' <small>(' + item.siteNameCV + ')</small>' : '');

        outStations.innerHTML = '';
        const secs = item.sec ? item.sec.split('_') : [];
        if (item.stations && item.stations.length) {
          item.stations.forEach((s, i) => {
            const coord = (item.coords && item.coords[i]) ? item.coords[i] : null;
            const cells = (item.cells && item.cells[s]) ? item.cells[s] : [];
            const meters = (item.meters && item.meters[s]) ? item.meters[s] : [];

            const wrap = document.createElement('div');
            wrap.style.marginBottom = '6px';

            const addr = (item.addr && item.addr[s]) || '';
            const smodAlarms = (item.smod && item.smod[s]) ? item.smod[s] : [];
            const lids = (item.lid && item.lid[s]) ? item.lid[s] : [];

            const bar = document.createElement('div');
            bar.className = 'station-bar';
            bar.innerHTML =
              '<span class="num">' + (i + 1) + '</span>' +
              '<span class="s-name-inline">' + s + '</span>' +
              (lids.length ? '<span class="lid">LID ' + lids.join('、') + '</span>' : '') +
              (addr ? '<span class="addr">' + addr + '</span>' : '') +
              (smodAlarms.length ? '<span class="eac-smod">SMOD 外部告警：' + smodAlarms.join('、') + '</span>' : '') +
              (meters.length ? '<span class="meter">電號 ' + meters.join('、') + '</span>' : '') +
              (secs[i] ? '<span class="sec">' + secs[i] + '</span>' : '') +
              (coord ? '<span class="coord2">' + coord.lat + ', ' + coord.lon + '</span>' : '') +
              (cells.length ? '<span class="toggle" data-idx="' + i + '">檢視細胞詳情 ▸</span>' : '') +
              (coord ? '<a class="mapbtn" target="_blank" rel="noopener" href="https://www.google.com/maps?q=' +
                coord.lat + ',' + coord.lon + '">Google 地圖</a>' : '');
            wrap.appendChild(bar);

            if (item.town === '苗栗市') {
              wrap.appendChild(createPhotoArea(s));
            }

            if (cells.length) {
              const detail = document.createElement('div');
              detail.className = 'detail';
              detail.id = 'detail-' + i;
              detail.innerHTML = buildCellDetail(item, s, coord);
              wrap.appendChild(detail);
            }

            outStations.appendChild(wrap);
          });

          const note = document.createElement('div');
          note.className = 'note';
          note.textContent = '點擊「檢視細胞詳情」可展開細胞資訊；「Google 地圖」可開啟位置';
          outStations.appendChild(note);

          outStations.querySelectorAll('.toggle').forEach(tgl => {
            tgl.addEventListener('click', () => {
              const d = document.getElementById('detail-' + tgl.dataset.idx);
              if (d) {
                const shown = d.classList.toggle('show');
                tgl.textContent = shown ? '收合細胞詳情 ▾' : '檢視細胞詳情 ▸';
              }
            });
          });
        } else {
          outStations.innerHTML = '<div class="placeholder">無站台資料</div>';
        }

        outMeta.innerHTML =
          'RAN 型態：' + (item.ranType || '-') +
          (item.sec ? '　｜　扇區全貌：' + item.sec : '');

        result.classList.add('show');
      }

      function findItem() {
        const id = idInput.value.trim();
        if (!id) { result.classList.remove('show'); return null; }
        const item = data.find(d => d.id === id);
        if (!item) {
          outName.textContent = '查無此台號';
          outName.style.color = '#c0392b';
          outStations.innerHTML = '';
          outMeta.innerHTML = '';
          result.classList.add('show');
          return null;
        }
        outName.style.color = '';
        return item;
      }

      function selectById(id) {
        idInput.value = id;
        idInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        idInput.focus();
        const item = data.find(d => d.id === id);
        if (item) render(item);
      }

      function renderSearch(q) {
        const keyword = q.trim();
        if (!keyword) {
          searchResults.classList.remove('show');
          searchResults.innerHTML = '';
          searchCount.textContent = '';
          return;
        }
        const matches = stationIndex.filter(s =>
          s.name.indexOf(keyword) !== -1 || s.siteNameCV.indexOf(keyword) !== -1
        );
        if (matches.length === 0) {
          searchResults.classList.add('show');
          searchResults.innerHTML = '<div class="center-hint">找不到符合的站台</div>';
          searchCount.textContent = '找到 0 筆';
          return;
        }
        searchCount.textContent = '找到 ' + matches.length + ' 筆站台';
        searchResults.innerHTML = '';
        matches.forEach(m => {
          const div = document.createElement('div');
          div.className = 'search-item';
          div.innerHTML =
            '<span class="s-arrow">›</span>' +
            '<div class="s-name">' + m.name + '</div>' +
            '<div class="s-meta">台號 ' + m.id + (m.sec ? '　｜　扇區 ' + m.sec : '') +
              '　｜　' + (m.siteNameCV || '') + '</div>';
          div.addEventListener('click', () => selectById(m.id));
          searchResults.appendChild(div);
        });
        searchResults.classList.add('show');
      }

      idInput.addEventListener('input', () => { const it = findItem(); if (it) render(it); });
      idInput.addEventListener('change', () => { const it = findItem(); if (it) render(it); });
      searchInput.addEventListener('input', () => renderSearch(searchInput.value));
    }

    // 頁籤切換
    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById('panel-' + tab.dataset.net).classList.add('active');
      });
    });

    createNetController({
      data: STATION_DATA,
      idInput: document.getElementById('idInput4g'),
      idList: document.getElementById('idList4g'),
      result: document.getElementById('result4g'),
      outName: document.getElementById('outName4g'),
      outStations: document.getElementById('outStations4g'),
      outMeta: document.getElementById('outMeta4g'),
      searchInput: document.getElementById('searchInput4g'),
      searchResults: document.getElementById('searchResults4g'),
      searchCount: document.getElementById('searchCount4g'),
      idLabel: 'lnCelId'
    });

    createNetController({
      data: STATION_DATA_5G,
      idInput: document.getElementById('idInput5g'),
      idList: document.getElementById('idList5g'),
      result: document.getElementById('result5g'),
      outName: document.getElementById('outName5g'),
      outStations: document.getElementById('outStations5g'),
      outMeta: document.getElementById('outMeta5g'),
      searchInput: document.getElementById('searchInput5g'),
      searchResults: document.getElementById('searchResults5g'),
      searchCount: document.getElementById('searchCount5g'),
      idLabel: 'nrCelId'
    });

    // PWA 離線支援
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.log('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
