name: Daily Taipower Meter Check

on:
  # 台電會擋國外機房 IP（GitHub Actions 連線逾時），暫停每日排程。
  # 改由台灣網路環境執行「台電查詢.bat」。
  # schedule:
  #   - cron: '0 22 * * *' # 06:00 Taipei (22:00 UTC previous day)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-outage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 ddddocr pillow numpy
      - name: Run meter check (4G meters only)
        env:
          TAIPOWER_PROXY: https://taipower-proxy.shane17258.workers.dev
        run: |
          python scripts/taipower_check.py
      - name: Commit outage.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outage.json || true
          git diff --cached --quiet || git commit -m "chore: update outage.json $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin master
          git push || (git pull --rebase origin master && git push) || echo "push failed"
